<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/public/styles/main.css">
</head>
<body>
{{> navbar}}
<table class="table">
    <thead></thead>
    <tbody>
    {{#each routes}}
    <tr class="agency-row" data-agency="{{agency_id}}">
        <td>{{route_id}}</td>
        <td>{{short_name}}</td>
        <td>{{long_name}}</td>
        <td>{{agency_id}}</td>
    </tr>
    {{/each}}
    </tbody>
</table>

<script>
    window.va =
        window.va ||
        function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var seen = new Set();

        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;

                var agency = entry.target.dataset.agency;
                if (!agency || seen.has(agency)) return;

                seen.add(agency);
                va('event', { name: 'Agency Viewed', data: { agency: agency } });
                observer.unobserve(entry.target);
            });
        }, { threshold: 0.5 }); // row must be at least 50% visible

        document.querySelectorAll('.agency-row').forEach(function (row) {
            observer.observe(row);
        });
    });
</script>

</body>
</html>
