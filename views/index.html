<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetroGO! Transit Map</title>
    <link rel="icon" type="image/svg+xml" href="/public/icons/favicon.ico" />
    <link rel="stylesheet" href="https://lacmta.github.io/design-system/dist/css/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/public/styles/main.css" />

    <!-- End Cloudflare Web Analytics -->
    <script defer data-domain="metrogo.app" src="https://clickport.io/tracker.js"></script>
    <!-- Vercel Web Analytics -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  </head>
  <body>
    {{> navbar}}
    <main id="app">
      <section id="map" aria-label="Map of live Metro Rail trains"></section>

      <header class="panel" id="header">
        <div class="header-top">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">M</span>
            <div>
              <h1 class="brand-title">Metro Rail Live</h1>
              <p class="brand-status">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="update-time">Connecting…</span>
              </p>
            </div>
          </div>

          <div class="stat" title="Trains currently on the map">
            <span class="stat-value" id="vehicle-count">0</span>
            <span class="stat-label">trains</span>
          </div>
        </div>

        <ul class="legend" aria-label="Lines">
          <li><img src="https://lacmta.github.io/metro-iconography/Service_ALine.svg" alt="" />A Line</li>
          <li><img src="https://lacmta.github.io/metro-iconography/Service_BLine.svg" alt="" />B Line</li>
          <li><img src="https://lacmta.github.io/metro-iconography/Service_CLine.svg" alt="" />C Line</li>
          <li><img src="https://lacmta.github.io/metro-iconography/Service_DLine.svg" alt="" />D Line</li>
          <li><img src="https://lacmta.github.io/metro-iconography/Service_ELine2.svg" alt="" />E Line</li>
          <li><img src="https://lacmta.github.io/metro-iconography/Service_KLine.svg" alt="" />K Line</li>
        </ul>
      </header>
      <aside id="sidebar">
        <h2 id="selected-stop">Click a stop</h2>
        <div class="table-scroll">
          <div id="stopTimesTable_body" class="departure-list"></div>
        </div>
      </aside>
    </main>

    <script src="/public/map.js"></script>
  </body>
</html>
